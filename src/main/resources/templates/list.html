<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>받은 메일</title>
<style>
  body { margin: 0; padding: 16px; background: #fff; color: #000;
         font-family: sans-serif; font-size: 28px; line-height: 1.5; }
  h1 { font-size: 40px; margin: 8px 0 20px; }
  a.mail { display: block; padding: 20px; margin-bottom: 20px; border: 3px solid #000;
           border-radius: 12px; color: #000; text-decoration: none; overflow-wrap: anywhere; }
  a.mail:active { background: #eee; }
  .from { font-weight: bold; }
  .date { color: #333; }
</style>
</head>
<body>
<h1>받은 메일</h1>
<a class="mail" th:each="m : ${mails}" th:href="@{/mail/{n}(n=${m.number()})}">
  <div class="from" th:text="${m.from()}">보낸 사람</div>
  <div th:text="${m.subject()}">제목</div>
  <div class="date" th:text="${m.sentDateText()}">날짜</div>
</a>
<p th:if="${mails.isEmpty()}">메일이 없습니다.</p>
</body>
</html>
